name: dosman_ujian
description: Aplikasi Ujian Online Anti-Kecurangan - SMAN 1 GIANYAR, Bali
publish_to: 'none'
version: 2.7.8+146

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client untuk Moodle REST API
  http: ^1.2.2

  # WebView untuk menampilkan quiz Moodle dalam mode lockdown
  flutter_inappwebview: ^6.1.5

  # Secure storage untuk token & kredensial
  flutter_secure_storage: ^10.0.0

  # Device info untuk binding perangkat
  device_info_plus: ^12.4.0

  # State management ringan
  provider: ^6.1.2

  # Icons material
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# Ikon launcher APK / iOS — gaya: latar navy gradasi + logo sekolah besar.
# Cara utama (tanpa Flutter): powershell -ExecutionPolicy Bypass -File tool\generate_app_icons.ps1
# Alternatif: dart run flutter_launcher_icons (memakai gambar hasil script di assets/icon/)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon_1024.png
  min_sdk_android: 21
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
