workflows:
  ios-workflow:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # Menghubungkan API Key yang baru saja Anda simpan di Codemagic
    integrations:
      app_store_connect: "Codemagic API Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sman1-gianyar.examdosman
      vars:
        BUNDLE_ID: "com.sman1-gianyar.examdosman"
        APP_STORE_APPLE_ID: 6823572758
        APPLE_TEAM_ID: "3RQKPHDMC8"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --archive-method=app-store
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build signed iOS IPA for TestFlight
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 138)
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" -lt 138 ] 2>/dev/null; then
            LATEST_BUILD=138
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Previous build number: $LATEST_BUILD"
          echo "Building with incremented build number: $NEXT_BUILD_NUMBER"
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$NEXT_BUILD_NUMBER

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Upload otomatis ke TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build Workflow
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK & App Bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true
