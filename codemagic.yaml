workflows:
  ios-workflow:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # Menghubungkan API Key yang baru saja Anda simpan di Codemagic
    integrations:
      app_store_connect: "Codemagic API Key"

    environment:
      vars:
        BUNDLE_ID: "com.sman1-gianyar.examdosman"
        APP_STORE_APPLE_ID: 6823572758
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Flutter iOS archive
        script: |
          flutter build ipa --release --no-codesign
      - name: Export and sign IPA for App Store
        script: |
          python3 -c '
          import glob, os, plistlib, subprocess, re

          team_id = ""
          # 1. Coba ekstrak Team ID dari provisioning profile yang diunduh
          profiles = glob.glob(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision"))
          for p in profiles:
              try:
                  out = subprocess.check_output(["security", "cms", "-D", "-i", p])
                  data = plistlib.loads(out)
                  teams = data.get("TeamIdentifier", [])
                  if teams:
                      team_id = teams[0]
                      print(f"Detected Apple Team ID from profile: {team_id}")
                      break
              except Exception:
                  pass

          # 2. Jika belum ketemu, ekstrak dari sertifikat di keychain
          if not team_id:
              try:
                  out = subprocess.check_output(["security", "find-identity", "-v", "-p", "codesigning"]).decode("utf-8")
                  m = re.search(r"\(([A-Z0-9]{10})\)", out)
                  if m:
                      team_id = m.group(1)
                      print(f"Detected Apple Team ID from keychain: {team_id}")
              except Exception:
                  pass

          # 3. Perbarui export_options.plist dengan teamID yang valid
          for plist_path in ["/Users/builder/export_options.plist", "ios/ExportOptions.plist"]:
              if os.path.exists(plist_path):
                  with open(plist_path, "rb") as f:
                      d = plistlib.load(f)
                  if team_id:
                      d["teamID"] = team_id
                  d["method"] = "app-store"
                  d["destination"] = "export"
                  d["signingStyle"] = "automatic"
                  if "provisioningProfiles" in d and isinstance(d["provisioningProfiles"], list):
                      del d["provisioningProfiles"]
                  with open(plist_path, "wb") as f:
                      plistlib.dump(d, f)
                  print(f"Updated {plist_path} with teamID: {team_id}")
          '
          PLIST_PATH="/Users/builder/export_options.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            PLIST_PATH="ios/ExportOptions.plist"
          fi
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$PLIST_PATH" \
            -allowProvisioningUpdates

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Upload otomatis ke TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build Workflow
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK & App Bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true
