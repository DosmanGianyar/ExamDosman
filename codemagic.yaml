workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Jika ingin signing otomatis dengan sertifikat Apple Developer di Codemagic:
      # groups:
      #   - apple_credentials
      # vars:
      #   APP_STORE_APPLE_ID: 123456789
    scripts:
      - name: Set up code signing settings on Xcode project (Optional)
        script: |
          xcode-project use-profiles
        ignore_failure: true
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
      - name: Package unsigned IPA (if needed)
        script: |
          set -e
          # Jika flutter build ipa --no-codesign hanya menghasilkan .xcarchive, bungkus Runner.app menjadi file .ipa
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ] && [ ! -f "build/ios/ipa/*.ipa" ]; then
            echo "Packaging Runner.xcarchive into Runner.ipa..."
            mkdir -p build/ios/ipa
            cd build/ios/archive/Runner.xcarchive/Products/Applications
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -qr ../../../../../build/ios/ipa/Runner.ipa Payload
            rm -rf Payload
            echo "Runner.ipa created successfully."
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build Workflow
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK & App Bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true
