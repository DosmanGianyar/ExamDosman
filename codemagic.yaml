workflows:
  ios-workflow:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # Menghubungkan API Key yang baru saja Anda simpan di Codemagic
    integrations:
      app_store_connect: "Codemagic API Key"

    environment:
      vars:
        BUNDLE_ID: "com.sman1-gianyar.examdosman"
        APP_STORE_APPLE_ID: 6823572758
        APPLE_TEAM_ID: "3RQKPHDMC8"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Flutter iOS archive
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 138)
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" -lt 138 ] 2>/dev/null; then
            LATEST_BUILD=138
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Previous build number: $LATEST_BUILD"
          echo "Building with incremented build number: $NEXT_BUILD_NUMBER"
          flutter build ipa --release --no-codesign --build-number=$NEXT_BUILD_NUMBER
      - name: Export and sign IPA for App Store
        script: |
          python3 -c '
          import plistlib, os
          path = "/Users/builder/export_options.plist"
          if os.path.exists(path):
              with open(path, "rb") as f:
                  d = plistlib.load(f)
              d["teamID"] = "3RQKPHDMC8"
              if "signingStyle" in d and d["signingStyle"] == "automatic":
                  del d["signingStyle"]
              if "provisioningProfiles" in d and isinstance(d["provisioningProfiles"], list):
                  del d["provisioningProfiles"]
              with open(path, "wb") as f:
                  plistlib.dump(d, f)
          '
          PLIST_PATH="/Users/builder/export_options.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            PLIST_PATH="ios/ExportOptions.plist"
          fi
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$PLIST_PATH" \
            -allowProvisioningUpdates

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Upload otomatis ke TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build Workflow
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK & App Bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true
