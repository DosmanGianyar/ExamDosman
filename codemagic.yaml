workflows:
  ios-workflow:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # Menghubungkan API Key yang baru saja Anda simpan di Codemagic
    integrations:
      app_store_connect: "Codemagic API Key"

    environment:
      vars:
        BUNDLE_ID: "com.sman1-gianyar.examdosman"
        APP_STORE_APPLE_ID: 6823572758
        APPLE_TEAM_ID: "3RQKPHDMC8"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Flutter iOS archive
        script: |
          flutter build ipa --release --no-codesign
      - name: Export and sign IPA for App Store
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Upload otomatis ke TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build Workflow
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK & App Bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - tailscaledosman@gmail.com
        notify:
          success: true
          failure: true
